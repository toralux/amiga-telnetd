name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: walkero/amiga-gcc:latest   # m68k-amigaos-gcc cross toolchain
    steps:
      - uses: actions/checkout@v4
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: telnetd-m68k
          path: telnetd
